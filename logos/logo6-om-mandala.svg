<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <!-- Logo 6: Om + Mandala sacred geometry style -->
  <defs>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#c9952e"/>
    </linearGradient>
    <linearGradient id="g6bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="140" rx="12" fill="url(#g6bg)"/>

  <!-- Mandala pattern -->
  <g transform="translate(70,70)">
    <!-- Outer lotus petals -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f0c040" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#f0c040" stroke-width="0.5" opacity="0.15"/>

    <!-- Sacred geometry triangles -->
    <polygon points="0,-42 36,21 -36,21" fill="none" stroke="url(#g6)" stroke-width="1" opacity="0.3"/>
    <polygon points="0,42 36,-21 -36,-21" fill="none" stroke="url(#g6)" stroke-width="1" opacity="0.3"/>

    <!-- Inner circles -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#g6)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#g6)" stroke-width="1" opacity="0.5"/>

    <!-- Petal shapes (8 directions) -->
    <ellipse cx="0" cy="-32" rx="4" ry="8" fill="url(#g6)" opacity="0.2"/>
    <ellipse cx="23" cy="-23" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(45,23,-23)"/>
    <ellipse cx="32" cy="0" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(90,32,0)"/>
    <ellipse cx="23" cy="23" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(135,23,23)"/>
    <ellipse cx="0" cy="32" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(180,0,32)"/>
    <ellipse cx="-23" cy="23" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(225,-23,23)"/>
    <ellipse cx="-32" cy="0" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(270,-32,0)"/>
    <ellipse cx="-23" cy="-23" rx="4" ry="8" fill="url(#g6)" opacity="0.2" transform="rotate(315,-23,-23)"/>

    <!-- Center Om -->
    <circle cx="0" cy="0" r="14" fill="url(#g6)" opacity="0.15"/>
    <text x="0" y="8" text-anchor="middle" fill="url(#g6)" font-size="22" font-weight="bold">ॐ</text>
  </g>

  <!-- Text - Premium styling -->
  <text x="135" y="38" fill="#f0c040" font-family="Georgia, serif" font-size="11" letter-spacing="10" opacity="0.4">M Y</text>
  <text x="135" y="72" fill="url(#g6)" font-family="Georgia, serif" font-size="38" font-weight="bold" letter-spacing="3">Patrika</text>
  <line x1="135" y1="82" x2="345" y2="82" stroke="url(#g6)" stroke-width="1" opacity="0.2"/>
  <text x="135" y="100" fill="#f0c040" font-family="Georgia, serif" font-size="12" letter-spacing="1" opacity="0.5">माय पत्रिका</text>
  <text x="240" y="100" fill="#ffffff" font-family="sans-serif" font-size="9" letter-spacing="1" opacity="0.25">Sacred Vedic Astrology</text>
</svg>
