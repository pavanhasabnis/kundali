<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <!-- Logo 2: Navagraha Circle with zodiac ring -->
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#d4a843"/>
    </linearGradient>
    <linearGradient id="g2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0519"/>
    </linearGradient>
  </defs>

  <rect width="400" height="140" rx="12" fill="url(#g2bg)"/>

  <!-- Outer zodiac ring -->
  <g transform="translate(70,70)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#g2)" stroke-width="1" opacity="0.3"/>

    <!-- 12 zodiac dots on outer ring -->
    <circle cx="0" cy="-48" r="2.5" fill="#f0c040"/>
    <circle cx="24" cy="-41.6" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="41.6" cy="-24" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="48" cy="0" r="2.5" fill="#f0c040"/>
    <circle cx="41.6" cy="24" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="24" cy="41.6" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="0" cy="48" r="2.5" fill="#f0c040"/>
    <circle cx="-24" cy="41.6" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="-41.6" cy="24" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="-48" cy="0" r="2.5" fill="#f0c040"/>
    <circle cx="-41.6" cy="-24" r="2" fill="#f0c040" opacity="0.7"/>
    <circle cx="-24" cy="-41.6" r="2" fill="#f0c040" opacity="0.7"/>

    <!-- Center sun with rays -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#f0c040" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#f0c040"/>

    <!-- Planet symbols around -->
    <text x="0" y="-22" text-anchor="middle" fill="#f0c040" font-size="8" opacity="0.8">☽</text>
    <text x="22" y="4" text-anchor="middle" fill="#f0c040" font-size="8" opacity="0.8">♂</text>
    <text x="-22" y="4" text-anchor="middle" fill="#f0c040" font-size="8" opacity="0.8">♃</text>
    <text x="0" y="28" text-anchor="middle" fill="#f0c040" font-size="8" opacity="0.8">♄</text>
  </g>

  <!-- Text -->
  <text x="135" y="48" fill="#f0c040" font-family="Georgia, serif" font-size="34" font-weight="bold">MyPatrika</text>
  <text x="137" y="72" fill="#ffffff" font-family="sans-serif" font-size="11" letter-spacing="5" opacity="0.4">JYOTISH SHASTRA</text>
  <line x1="135" y1="82" x2="330" y2="82" stroke="#f0c040" stroke-width="0.5" opacity="0.2"/>
  <text x="135" y="100" fill="#f0c040" font-family="sans-serif" font-size="12" opacity="0.6">माय पत्रिका</text>
  <text x="220" y="100" fill="#ffffff" font-family="sans-serif" font-size="10" opacity="0.3">| नवग्रह ज्योतिष</text>
</svg>
