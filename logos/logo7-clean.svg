<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <!-- Logo 7: Clean unified font, no italic mismatch -->
  <defs>
    <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d662"/>
      <stop offset="50%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8941f"/>
    </linearGradient>
    <linearGradient id="g7bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <rect width="500" height="160" rx="14" fill="url(#g7bg)"/>

  <!-- Mandala -->
  <g transform="translate(80,80)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f5d662" stroke-width="0.5" opacity="0.15"/>
    <polygon points="0,-46 40,23 -40,23" fill="none" stroke="url(#g7)" stroke-width="1" opacity="0.25"/>
    <polygon points="0,46 40,-23 -40,-23" fill="none" stroke="url(#g7)" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#g7)" stroke-width="1.5" opacity="0.35"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#g7)" stroke-width="1" opacity="0.45"/>
    <ellipse cx="0" cy="-36" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18"/>
    <ellipse cx="25.5" cy="-25.5" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(45,25.5,-25.5)"/>
    <ellipse cx="36" cy="0" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(90,36,0)"/>
    <ellipse cx="25.5" cy="25.5" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(135,25.5,25.5)"/>
    <ellipse cx="0" cy="36" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(180,0,36)"/>
    <ellipse cx="-25.5" cy="25.5" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(225,-25.5,25.5)"/>
    <ellipse cx="-36" cy="0" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(270,-36,0)"/>
    <ellipse cx="-25.5" cy="-25.5" rx="4.5" ry="9" fill="url(#g7)" opacity="0.18" transform="rotate(315,-25.5,-25.5)"/>
    <circle cx="0" cy="0" r="16" fill="url(#g7)" opacity="0.12"/>
    <text x="0" y="9" text-anchor="middle" fill="url(#g7)" font-size="24" font-weight="bold">ॐ</text>
  </g>

  <!-- VERSION A: All caps, uniform weight -->
  <g transform="translate(155,0)">
    <text x="0" y="58" fill="url(#g7)" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="300" letter-spacing="8">MYPATRIKA</text>

    <line x1="0" y1="68" x2="330" y2="68" stroke="url(#g7)" stroke-width="0.5" opacity="0.3"/>

    <text x="0" y="90" fill="#d4a843" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="8" opacity="0.5">VEDIC ASTROLOGY</text>

    <text x="0" y="118" fill="#d4a843" font-family="sans-serif" font-size="14" letter-spacing="1" opacity="0.55">माय पत्रिका — वैदिक ज्योतिष</text>
  </g>
</svg>
