<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <!-- Logo 9: Modern connected - dot separator between My.Patrika -->
  <defs>
    <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d662"/>
      <stop offset="50%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8941f"/>
    </linearGradient>
    <linearGradient id="g9bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <rect width="500" height="160" rx="14" fill="url(#g9bg)"/>

  <!-- Mandala -->
  <g transform="translate(80,80)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f5d662" stroke-width="0.5" opacity="0.15"/>
    <polygon points="0,-46 40,23 -40,23" fill="none" stroke="url(#g9)" stroke-width="1" opacity="0.25"/>
    <polygon points="0,46 40,-23 -40,-23" fill="none" stroke="url(#g9)" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#g9)" stroke-width="1.5" opacity="0.35"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#g9)" stroke-width="1" opacity="0.45"/>
    <ellipse cx="0" cy="-36" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18"/>
    <ellipse cx="25.5" cy="-25.5" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(45,25.5,-25.5)"/>
    <ellipse cx="36" cy="0" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(90,36,0)"/>
    <ellipse cx="25.5" cy="25.5" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(135,25.5,25.5)"/>
    <ellipse cx="0" cy="36" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(180,0,36)"/>
    <ellipse cx="-25.5" cy="25.5" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(225,-25.5,25.5)"/>
    <ellipse cx="-36" cy="0" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(270,-36,0)"/>
    <ellipse cx="-25.5" cy="-25.5" rx="4.5" ry="9" fill="url(#g9)" opacity="0.18" transform="rotate(315,-25.5,-25.5)"/>
    <circle cx="0" cy="0" r="16" fill="url(#g9)" opacity="0.12"/>
    <text x="0" y="9" text-anchor="middle" fill="url(#g9)" font-size="24" font-weight="bold">ॐ</text>
  </g>

  <!-- Text: My·Patrika modern style -->
  <g transform="translate(155,0)">
    <!-- "My" light weight -->
    <text x="0" y="62" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="200" letter-spacing="2" opacity="0.85">My</text>

    <!-- Gold dot separator -->
    <circle cx="80" cy="54" r="4" fill="url(#g9)"/>

    <!-- "Patrika" bold gold -->
    <text x="92" y="62" fill="url(#g9)" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="2">Patrika</text>

    <!-- Subtle line -->
    <line x1="0" y1="74" x2="320" y2="74" stroke="url(#g9)" stroke-width="0.3" opacity="0.2"/>

    <!-- Marathi in Devanagari -->
    <text x="0" y="98" fill="#d4a843" font-family="sans-serif" font-size="15" letter-spacing="3" opacity="0.55">माय पत्रिका</text>

    <!-- Services -->
    <text x="0" y="122" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="4" opacity="0.2">KUNDALI  ·  RASHIFAL  ·  PANCHANG  ·  MATCHING</text>
  </g>
</svg>
