<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <!-- Logo 4: Patrika Diamond Shape with M monogram -->
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="50%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#d4a843"/>
    </linearGradient>
    <linearGradient id="g4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#162040"/>
    </linearGradient>
  </defs>

  <rect width="400" height="140" rx="12" fill="url(#g4bg)"/>

  <!-- Kundali Patrika shape as logo mark -->
  <g transform="translate(70,70)">
    <!-- Outer patrika diamond -->
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="url(#g4)" stroke-width="2.5" transform="rotate(45)" rx="3"/>

    <!-- House division lines -->
    <line x1="-40" y1="0" x2="0" y2="-40" stroke="#d4a843" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-40" x2="40" y2="0" stroke="#d4a843" stroke-width="1" opacity="0.4"/>
    <line x1="40" y1="0" x2="0" y2="40" stroke="#d4a843" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="40" x2="-40" y2="0" stroke="#d4a843" stroke-width="1" opacity="0.4"/>

    <!-- Inner diamond -->
    <rect x="-20" y="-20" width="40" height="40" fill="url(#g4)" transform="rotate(45)" rx="2" opacity="0.15"/>

    <!-- M letter in center -->
    <text x="0" y="10" text-anchor="middle" fill="url(#g4)" font-family="Georgia, serif" font-size="30" font-weight="bold">M</text>

    <!-- Small planet dots in houses -->
    <circle cx="-25" cy="-8" r="2" fill="#f0d060" opacity="0.6"/>
    <circle cx="8" cy="-25" r="2" fill="#f0d060" opacity="0.6"/>
    <circle cx="25" cy="8" r="2" fill="#f0d060" opacity="0.6"/>
    <circle cx="-8" cy="25" r="2" fill="#f0d060" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="130" y="52" fill="url(#g4)" font-family="Georgia, serif" font-size="36" font-weight="bold" letter-spacing="1">MyPatrika</text>
  <text x="132" y="75" fill="#d4a843" font-family="sans-serif" font-size="11" letter-spacing="4" opacity="0.5">YOUR COSMIC BLUEPRINT</text>
  <line x1="130" y1="86" x2="350" y2="86" stroke="#d4a843" stroke-width="0.5" opacity="0.2"/>
  <text x="130" y="105" fill="#ffffff" font-family="sans-serif" font-size="12" opacity="0.4">माय पत्रिका — तुमचा भाग्याचा आरसा</text>
</svg>
