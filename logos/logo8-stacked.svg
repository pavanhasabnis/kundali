<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <!-- Logo 8: Stacked layout - MY on top, PATRIKA large below -->
  <defs>
    <linearGradient id="g8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d662"/>
      <stop offset="50%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8941f"/>
    </linearGradient>
    <linearGradient id="g8bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <rect width="500" height="160" rx="14" fill="url(#g8bg)"/>

  <!-- Mandala -->
  <g transform="translate(80,80)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f5d662" stroke-width="0.5" opacity="0.15"/>
    <polygon points="0,-46 40,23 -40,23" fill="none" stroke="url(#g8)" stroke-width="1" opacity="0.25"/>
    <polygon points="0,46 40,-23 -40,-23" fill="none" stroke="url(#g8)" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#g8)" stroke-width="1.5" opacity="0.35"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#g8)" stroke-width="1" opacity="0.45"/>
    <ellipse cx="0" cy="-36" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18"/>
    <ellipse cx="25.5" cy="-25.5" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(45,25.5,-25.5)"/>
    <ellipse cx="36" cy="0" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(90,36,0)"/>
    <ellipse cx="25.5" cy="25.5" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(135,25.5,25.5)"/>
    <ellipse cx="0" cy="36" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(180,0,36)"/>
    <ellipse cx="-25.5" cy="25.5" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(225,-25.5,25.5)"/>
    <ellipse cx="-36" cy="0" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(270,-36,0)"/>
    <ellipse cx="-25.5" cy="-25.5" rx="4.5" ry="9" fill="url(#g8)" opacity="0.18" transform="rotate(315,-25.5,-25.5)"/>
    <circle cx="0" cy="0" r="16" fill="url(#g8)" opacity="0.12"/>
    <text x="0" y="9" text-anchor="middle" fill="url(#g8)" font-size="24" font-weight="bold">ॐ</text>
  </g>

  <!-- Text: "my" small on top, "PATRIKA" big below -->
  <g transform="translate(155,0)">
    <!-- "my" small elegant -->
    <text x="2" y="38" fill="#d4a843" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="12" opacity="0.6">my</text>

    <!-- "PATRIKA" large bold -->
    <text x="0" y="78" fill="url(#g8)" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="6">PATRIKA</text>

    <!-- Thin gold line -->
    <line x1="0" y1="88" x2="310" y2="88" stroke="url(#g8)" stroke-width="0.5" opacity="0.25"/>

    <!-- Marathi -->
    <text x="0" y="110" fill="#d4a843" font-family="sans-serif" font-size="13" letter-spacing="2" opacity="0.5">माय पत्रिका</text>
    <text x="120" y="110" fill="#ffffff" font-family="sans-serif" font-size="10" letter-spacing="1" opacity="0.2">·  वैदिक ज्योतिष सेवा</text>
  </g>
</svg>
