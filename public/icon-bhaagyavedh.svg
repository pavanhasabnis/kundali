<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="50%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Zodiac ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="21.5 21.5" opacity="0.5"/>

  <!-- 12 zodiac ticks -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="4" x2="100" y2="16"/>
    <line x1="148" y1="13.4" x2="143" y2="24"/>
    <line x1="186.6" y1="52" x2="176" y2="58"/>
    <line x1="196" y1="100" x2="184" y2="100"/>
    <line x1="186.6" y1="148" x2="176" y2="142"/>
    <line x1="148" y1="186.6" x2="143" y2="176"/>
    <line x1="100" y1="196" x2="100" y2="184"/>
    <line x1="52" y1="186.6" x2="57" y2="176"/>
    <line x1="13.4" y1="148" x2="24" y2="142"/>
    <line x1="4" y1="100" x2="16" y2="100"/>
    <line x1="13.4" y1="52" x2="24" y2="58"/>
    <line x1="52" y1="13.4" x2="57" y2="24"/>
  </g>

  <!-- Orbital paths -->
  <ellipse cx="100" cy="100" rx="55" ry="22" fill="none" stroke="#D97706" stroke-width="0.6" opacity="0.25" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="55" ry="22" fill="none" stroke="#D97706" stroke-width="0.6" opacity="0.25" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="55" ry="22" fill="none" stroke="#D97706" stroke-width="0.6" opacity="0.25" transform="rotate(90 100 100)"/>

  <!-- Center 'भा' -->
  <text x="100" y="118" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="url(#gold)" filter="url(#glow)">भा</text>

  <!-- Decorative stars -->
  <g fill="#FCD34D" filter="url(#glow)">
    <circle cx="100" cy="5" r="3.5"/>
    <circle cx="190" cy="60" r="2.5"/>
    <circle cx="192" cy="145" r="3"/>
    <circle cx="10" cy="65" r="2.5"/>
    <circle cx="15" cy="150" r="3"/>
    <circle cx="150" cy="190" r="2.5"/>
    <circle cx="50" cy="8" r="2.2"/>
  </g>
</svg>