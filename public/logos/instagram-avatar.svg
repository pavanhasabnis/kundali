<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#E8831F"/>
      <stop offset="55%" stop-color="#CC6600"/>
      <stop offset="100%" stop-color="#6B2E00"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5B0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD699" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <g opacity="0.18" fill="#FFE5B0">
    <circle cx="150" cy="180" r="3"/>
    <circle cx="920" cy="220" r="4"/>
    <circle cx="220" cy="880" r="3.5"/>
    <circle cx="880" cy="860" r="3"/>
    <circle cx="540" cy="100" r="2.5"/>
    <circle cx="80" cy="540" r="3"/>
    <circle cx="1000" cy="540" r="3"/>
    <circle cx="540" cy="980" r="2.5"/>
    <circle cx="300" cy="320" r="2"/>
    <circle cx="780" cy="740" r="2"/>
  </g>

  <circle cx="540" cy="540" r="440" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.55"/>
  <circle cx="540" cy="540" r="410" fill="none" stroke="#FFD699" stroke-width="1" stroke-dasharray="4 10" opacity="0.35"/>
  <circle cx="540" cy="540" r="370" fill="none" stroke="#FFD699" stroke-width="1.5" opacity="0.22"/>

  <g opacity="0.14" stroke="#FFD699" stroke-width="1.5" fill="none">
    <ellipse cx="540" cy="540" rx="300" ry="110" transform="rotate(-30 540 540)"/>
    <ellipse cx="540" cy="540" rx="300" ry="110" transform="rotate(30 540 540)"/>
    <ellipse cx="540" cy="540" rx="300" ry="110" transform="rotate(90 540 540)"/>
  </g>

  <text x="540" y="685" text-anchor="middle"
    font-family="'Inclusive Sans', 'Noto Sans Devanagari', sans-serif"
    font-size="520" font-weight="700" fill="#FFF5E6" filter="url(#glow)">भा</text>
</svg>
