<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <!-- Gradient for main text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for the circle/ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Star glow -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="16" fill="#0F172A"/>

  <!-- Outer celestial ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Inner ring with dashes (zodiac ring) -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="15.2 15.2" opacity="0.6"/>

  <!-- 12 zodiac tick marks -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="30" x2="100" y2="38"/>
    <line x1="135" y1="32.68" x2="131" y2="39.6"/>
    <line x1="160.62" y1="50" x2="154.62" y2="55"/>
    <line x1="170" y1="100" x2="162" y2="100"/>
    <line x1="160.62" y1="150" x2="154.62" y2="145"/>
    <line x1="135" y1="167.32" x2="131" y2="160.4"/>
    <line x1="100" y1="170" x2="100" y2="162"/>
    <line x1="65" y1="167.32" x2="69" y2="160.4"/>
    <line x1="39.38" y1="150" x2="45.38" y2="145"/>
    <line x1="30" y1="100" x2="38" y2="100"/>
    <line x1="39.38" y1="50" x2="45.38" y2="55"/>
    <line x1="65" y1="32.68" x2="69" y2="39.6"/>
  </g>

  <!-- Center Devanagari 'भा' -->
  <text x="100" y="112" text-anchor="middle" font-family="serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">भा</text>

  <!-- Small decorative stars around the ring -->
  <g fill="#FCD34D" filter="url(#starGlow)">
    <circle cx="100" cy="26" r="3"/>
    <circle cx="170" cy="65" r="2"/>
    <circle cx="170" cy="135" r="2.5"/>
    <circle cx="30" cy="70" r="2"/>
    <circle cx="35" cy="140" r="2.5"/>
    <circle cx="140" cy="170" r="2"/>
    <circle cx="55" cy="28" r="1.8"/>
  </g>

  <!-- Planet orbit paths (subtle) -->
  <ellipse cx="100" cy="100" rx="45" ry="20" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.3" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="45" ry="20" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.3" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="45" ry="20" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.3" transform="rotate(90 100 100)"/>

  <!-- Main brand name -->
  <text x="210" y="95" font-family="serif" font-size="48" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="2">Bhaagyavedh</text>

  <!-- Devanagari subtitle -->
  <text x="210" y="130" font-family="serif" font-size="22" fill="#FCD34D" opacity="0.85" letter-spacing="4">भाग्यवेध</text>

  <!-- Tagline -->
  <text x="210" y="158" font-family="sans-serif" font-size="13" fill="#94A3B8" letter-spacing="3">VEDIC ASTROLOGY &amp; DIVINE JOURNEYS</text>

  <!-- Decorative line under brand -->
  <line x1="210" y1="138" x2="520" y2="138" stroke="#D97706" stroke-width="0.5" opacity="0.4"/>

  <!-- Small accent stars scattered -->
  <g fill="#FCD34D" opacity="0.4">
    <circle cx="540" cy="40" r="1.5"/>
    <circle cx="560" cy="55" r="1"/>
    <circle cx="530" cy="60" r="1.2"/>
    <circle cx="555" cy="150" r="1.5"/>
    <circle cx="570" cy="165" r="1"/>
    <circle cx="220" cy="40" r="1"/>
    <circle cx="480" cy="35" r="1.3"/>
  </g>
</svg>